spring:
  application:
    name: piagent

server:
  port: 8080

# PiAgent 核心配置
piagent:
  # Agent 配置
  agent:
    # Agent Loop 最大执行步数，防止无限循环
    max-steps: 10
    # 默认系统提示词
    default-system-prompt: "你是一个智能助手，名为 PiAgent。尽你所能帮助用户。"
  
  # LLM 配置
  llm:
    # 模型提供商类型：openai, ollama, dashscope, deepseek
    provider: openai
    # OpenAI 配置
    openai:
      api-key: ${OPENAI_API_KEY:sk-demo-key}
      model-name: gpt-4o-mini
      base-url: https://api.openai.com/v1
      timeout: 60
    # Ollama 配置（本地模型）
    ollama:
      base-url: http://localhost:11434
      model-name: llama3.2
      timeout: 120
    # 通义千问配置
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen-plus
      base-url: https://dashscope.aliyuncs.com/api/v1
      timeout: 60
    # DeepSeek 配置
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: deepseek-chat
      base-url: https://api.deepseek.com/v1
      timeout: 60

  # Session 配置
  session:
    # 是否启用持久化（预留接口，当前仅支持内存）
    persistence-enabled: false

  # 事件配置
  event:
    # 是否启用 SSE 流式输出
    sse-enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.example.piagent: DEBUG
    dev.langchain4j: DEBUG
